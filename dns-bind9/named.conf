options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion yes;
    dnssec-validation auto;
    auth-nxdomain no;
};

zone "lab.dnsaid.test" {
    type master;
    file "/etc/bind/zones/db.lab.dnsaid.test.signed";
    allow-transfer { none; };
};
